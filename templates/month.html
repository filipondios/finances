<section class="hero">
  <div>
    <p class="eyebrow">Transactions</p>
    <h1>{{label}}</h1>
  </div>
  <div class="month-nav">
    {{#has_prev}}<a class="btn" href="/month/{{prev_month}}">← {{prev_label}}</a>{{/has_prev}}
    {{#has_next}}<a class="btn" href="/month/{{next_month}}">{{next_label}} →</a>{{/has_next}}
  </div>
</section>

<form class="entry-form" id="entry-form" hx-post="/entries" hx-target="#month-content" hx-swap="innerHTML"
      hx-on:entry-added="this.reset();document.getElementById('form-error').textContent=''">
  <input type="hidden" name="month" value="{{month}}">
  <label>Title<input name="title" maxlength="100" required placeholder="e.g. Grocery shopping"></label>
  <label>Amount<input name="amount" inputmode="decimal" required placeholder="0,00"></label>
  <label>Type<select name="kind"><option value="expense">Expense</option><option value="income">Income</option></select></label>
  <label>Category<select name="category">
    {{#categories}}<option value="{{key}}">{{label}}</option>{{/categories}}
  </select></label>
  <label>Date<input name="date" type="date" value="{{today}}" required></label>
  <button class="btn primary" type="submit">Add</button>
  <p id="form-error" class="error"></p>
</form>

<div id="month-content">
  {{{month_content}}}
</div>
