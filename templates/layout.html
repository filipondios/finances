<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} · My Finances</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/chart.umd.min.js" defer></script>
</head>
<body>
<header class="topbar">
  <div class="wrap bar">
    <a class="brand" href="/">💰 My Finances</a>
    <nav>
      <a href="/" {{#dash_active}}class="active"{{/dash_active}}>Dashboard</a>
      <a href="/month/{{current_month}}" {{#month_active}}class="active"{{/month_active}}>This month</a>
      <select aria-label="Go to another month" onchange="if(this.value) location.href=this.value">
        <option value="">Other months…</option>
        {{#months}}
        <option value="/month/{{month}}" {{#selected}}selected{{/selected}}>{{label}}</option>
        {{/months}}
      </select>
    </nav>
  </div>
</header>

<main class="wrap" hx-on::after-swap="renderMonthChart()">{{{content}}}</main>

<footer class="wrap muted foot">Everything is stored in <code>finances.db</code> (SQLite). Local data only.</footer>

<dialog id="share-dialog" class="modal"><div id="share-dialog-content"></div></dialog>

<script>
function openShareDialog() { document.getElementById('share-dialog').showModal(); }
function closeShareDialog() { document.getElementById('share-dialog').close(); }
function toggleNewPerson() {
  const select = document.getElementById('share-person');
  const isNew = select && select.value === 'new';
  document.getElementById('new-person-field').hidden = !isNew;
  const form = document.querySelector('#share-dialog .entry-form');
  if (form) form.classList.toggle('with-new', isNew);
}
function renderDashboardChart() {
  const el = document.getElementById('dashChart');
  if (!el || typeof Chart === 'undefined') return;
  const d = JSON.parse(document.getElementById('dashChartData').textContent);
  new Chart(el, {
    type: 'bar',
    data: { labels: d.labels, datasets: [
      { label: 'Income', data: d.income, backgroundColor: '#2f9e6d', borderRadius: 6 },
      { label: 'Expenses', data: d.expenses, backgroundColor: '#e06b6b', borderRadius: 6 }
    ] },
    options: { responsive: true, plugins: { legend: { position: 'bottom' } }, scales: { y: { beginAtZero: true } } }
  });
}
function renderDashboardCurrentChart() {
  const el = document.getElementById('dashCurrentChart');
  if (!el || typeof Chart === 'undefined') return;
  const d = JSON.parse(document.getElementById('dashCurrentChartData').textContent);
  new Chart(el, {
    type: 'bar',
    indexAxis: 'y',
    data: { labels: d.labels, datasets: [
      { label: 'Income', data: [d.income[0]], backgroundColor: '#2f9e6d', borderRadius: 6 },
      { label: 'Expenses', data: [d.expenses[0]], backgroundColor: '#e06b6b', borderRadius: 6 }
    ] },
    options: { responsive: true, plugins: { legend: { position: 'bottom' } }, scales: { x: { beginAtZero: true } } }
  });
}
function renderDoughnut(canvasId, dataId) {
  const el = document.getElementById(canvasId);
  if (!el || typeof Chart === 'undefined') return null;
  const d = JSON.parse(document.getElementById(dataId).textContent);
  return new Chart(el, {
    type: 'doughnut',
    data: { labels: d.labels, datasets: [{ data: d.values,
      backgroundColor: ['#3b7dd8', '#e08b3e', '#7b61c9', '#3fa88b', '#b0b7c3'], borderWidth: 0 }] },
    options: { responsive: true, cutout: '68%', plugins: { legend: { position: 'bottom' } } }
  });
}
function renderMonthChart() {
  if (window._catChart) window._catChart.destroy();
  window._catChart = renderDoughnut('catChart', 'catChartData');
}
document.addEventListener('DOMContentLoaded', function () {
  renderDashboardChart();
  renderDashboardCurrentChart();
  renderDoughnut('dashCategoryChart', 'dashCategoryChartData');
  renderDoughnut('currentCategoryChart', 'currentCategoryChartData');
  renderMonthChart();
});
</script>
</body>
</html>
